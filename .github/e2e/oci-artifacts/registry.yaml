# CI-owned duplicate of hack/oci-test-artifacts/registry.yaml (kept in sync by hand) so
# .github/workflows/test-e2e-chainsaw.yml has no dependency on hack/ or the Makefile.
apiVersion: v1
kind: Namespace
metadata:
  name: oci-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: oci-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: oci-registry
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  type: NodePort
