name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Setup envtest binaries
        run: |
          ENVTEST_K8S_VERSION=$(go list -m -f '{{ .Version }}' k8s.io/api \
            | awk -F'[v.]' '{printf "1.%d", $3}')
          make setup-envtest
          KUBEBUILDER_ASSETS="$(./bin/setup-envtest use "${ENVTEST_K8S_VERSION}" -p path)"
          echo "KUBEBUILDER_ASSETS=${KUBEBUILDER_ASSETS}" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          go test ./... -coverprofile cover.out
