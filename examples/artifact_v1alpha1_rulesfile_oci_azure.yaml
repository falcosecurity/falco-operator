# Pull an OCI artifact from Azure Container Registry (ACR) authenticated via an Azure identity,
# instead of a static username/password Secret (see artifact_v1alpha1_rulesfile_oci_private.yaml
# for that). This implements ACR's own documented AAD token exchange specifically -- not a
# registry-agnostic distribution-spec mechanism other registries can assume they support just
# because they expose a similarly-shaped OAuth2 exchange endpoint.
#
# Exactly one of the four methods below is active per resource, selected by spec.registry.auth.azure.method.
#
# Every field except serviceAccountRef falls back to the matching AZURE_* environment variable
# (on the falco-operator Deployment itself) when left unset here -- a config value always wins
# when both are set. This lets one cluster-wide default identity be set once via the operator's
# own env, with individual resources overriding only what differs; see AzureAuth's godoc for the
# full list of variable names. serviceAccountRef has no environment equivalent: it names which
# ServiceAccount to federate, not a credential value, so it must always be set in the CR when
# method is workloadIdentity.
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  labels:
    app.kubernetes.io/managed-by: falco-operator
  name: rulesfile-oci-azure
  namespace: default
spec:
  ociArtifact:
    image:
      repository: my-org/falco-rules
      tag: v1.0.0
    registry:
      name: myregistry.azurecr.io
      auth:
        azure:
          # --- method: workloadIdentity (active in this example) ---
          # Federates the "acr-reader" ServiceAccount (must exist in this resource's own
          # namespace) to an Entra app/managed identity via OIDC trust. The Azure-side
          # federated identity credential's subject must be
          # system:serviceaccount:default:acr-reader, and it needs at least the AcrPull role
          # on this registry. No Secret involved.
          method: workloadIdentity
          tenantId: 00000000-0000-0000-0000-000000000000
          clientId: 11111111-1111-1111-1111-111111111111
          serviceAccountRef:
            name: acr-reader

          # --- method: clientSecret ---
          # method: clientSecret
          # tenantId: 00000000-0000-0000-0000-000000000000
          # clientId: 11111111-1111-1111-1111-111111111111
          # clientSecretRef:
          #   name: azure-app-credentials # Secret key: clientSecret

          # --- method: clientCertificate ---
          # method: clientCertificate
          # tenantId: 00000000-0000-0000-0000-000000000000
          # clientId: 11111111-1111-1111-1111-111111111111
          # clientCertificateRef:
          #   name: azure-app-certificate # Secret keys: certificate (+ optional password)
          # sendCertificateChain: false # true only for Subject Name/Issuer (SNI) trust -- see the field's godoc

          # --- method: managedIdentity ---
          # Authenticates via the node's Azure Instance Metadata Service (IMDS). No
          # per-namespace/per-artifact isolation -- every AzureAuth using this method resolves
          # to whichever identity is attached to the node the operator pod is scheduled on.
          # method: managedIdentity
          # clientId: 11111111-1111-1111-1111-111111111111 # omit entirely for system-assigned

          # --- method: clientSecret, entirely from the operator's own environment ---
          # A minimal CR relying on AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET set on
          # the falco-operator Deployment -- nothing but method here. Useful when every
          # Rulesfile/Plugin/Config resource in the cluster shares one identity and repeating
          # tenantId/clientId/clientSecretRef in each CR would just be duplication.
          # method: clientSecret
  priority: 40
