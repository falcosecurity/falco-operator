apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: config-update-inline
spec:
  description: |
    Validates that patching spec.config on a Config CR causes the disk file to be
    rewritten in-place with the new content while conditions remain True.

    Setup: Falco (real). Config CR with inline source (log_level: info).
    Reaches Programmed=True, file at /etc/falco/config.d/50-03-…-inline.yaml.

    After patching spec.config to log_level: debug:
    - InlineArtifactProgrammed=True, Programmed=True remain True.
    - The disk file at the SAME path now contains "log_level: debug".

  bindings:
    - name: falco_name
      value: falco-config-update-inline-test
    - name: config_name
      value: config-update-inline-test
    - name: test_name
      value: config-update-inline

  steps:
    - name: "Step 01: Create-falco"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-config-inline-v1"
      use:
        template: ../../common/_step_templates/apply-config.yaml
        with:
          bindings:
            - name: config_name
              value: ($config_name)
            - name: namespace
              value: ($namespace)
            - name: config_spec
              value:
                config:
                  json_output: false
                  log_level: info

    - name: "Step 03: Assert-initial-conditions"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              metadata:
                name: ($config_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'

    - name: "Step 04: Assert-initial-content-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-content-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/config.d
            - name: content_pattern
              value: "log_level: info"

    - name: "Step 05: Patch-config-inline-v2"
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              metadata:
                name: ($config_name)
                namespace: ($namespace)
              spec:
                config:
                  json_output: false
                  log_level: debug

    - name: "Step 06: Assert-updated-conditions"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              metadata:
                name: ($config_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'

    - name: "Step 07: Assert-file-still-present"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/config.d
            - name: expected_file
              value: 50-03-config-update-inline-test-inline.yaml
            - name: should_exist
              value: "true"

    - name: "Step 08: Assert-updated-content-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-content-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/config.d
            - name: content_pattern
              value: "log_level: debug"

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
