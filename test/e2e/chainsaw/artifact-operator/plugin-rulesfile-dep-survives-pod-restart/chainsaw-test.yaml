apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: plugin-rulesfile-dep-survives-pod-restart
spec:
  description: |
    Plugin deletion remains blocked by its Rulesfile dependency after a DaemonSet
    rolling restart replaces the Falco Pods. Removing the Rulesfile then allows
    ArtifactNode and parent Plugin cleanup to complete.
    The replacement Pods reinstall artifacts on new volumes; same-Pod recovery
    is covered separately by plugin-rulesfile-dep-survives-sidecar-restart.

  bindings:
    - name: falco_name
      value: falco-dep-survives-pod-restart-test
    - name: rulesfile_name
      value: rulesfile-dep-survives-pod-restart-test
    - name: plugin_name
      value: container
    - name: test_name
      value: plugin-rulesfile-dep-survives-pod-restart
    - name: oci_registry
      value: registry.oci-registry.svc.cluster.local:5000

  steps:
    - name: "Step 01: Create-falco"
      description: |
        Real Falco in enforce mode. Keep maxSurge:1/maxUnavailable:0 so the
        rolling restart brings up each replacement before removing the old Pod.
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: update_strategy
              value:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 1
                  maxUnavailable: 0

    - name: "Step 02: Install-plugin"
      description: |
        Install container from the local OCI registry and verify Plugin programming,
        installed-file metadata and ConfigProgrammed=True on the ArtifactNode.
      use:
        template: ../../common/_step_templates/apply-assert-plugin.yaml
        with:
          bindings:
            - name: plugin_name
              value: ($plugin_name)
            - name: namespace
              value: ($namespace)
            - name: plugin_oci_repo
              value: falco-test/plugin-container
            - name: plugin_oci_tag
              value: latest
            - name: plugin_oci_registry
              value: ($oci_registry)
            - name: plugin_plain_http
              value: true

    - name: "Step 03: Wait-plugin-loaded-in-falco"
      description: Poll Falco /versions until container appears in plugin_versions.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: PLUGIN_NAME
                value: ($plugin_name)
            content: |
              bash ../../common/scripts/check_falco_plugin_loaded.sh

    - name: "Step 04: Create-rulesfile"
      description: |
        OCI rulesfile (falco-test/rulesfile-official) that declares a container
        plugin dependency, created after the plugin is already loaded.
        Note: ($oci_registry) must appear directly in the resource spec, not inside a
        binding value object: chainsaw does not recursively expand ($expr) strings
        embedded within complex binding values.
      try:
        - apply:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-official
                    tag: latest
                  registry:
                    name: ($oci_registry)
                    plainHTTP: true

    - name: "Step 05: Assert-rulesfile-programmed"
      description: With the container plugin already loaded, the dependency is met immediately.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'

    - name: "Step 06: Rollout-restart-falco"
      description: |
        Replace the Falco Pods through a DaemonSet rolling restart and wait for
        rollout completion. Unlike a sidecar restart, this creates new artifact volumes.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: DAEMONSET_NAME
                value: ($falco_name)
            content: |
              bash ../../common/scripts/rollout_restart_daemonset.sh

    - name: "Step 07: Wait-artifact-operator-sidecar-ready"
      description: |
        Wait for the replacement Pods' artifact-operator containers to report ready.
        The following deletion checks verify that installed dependencies are protected.
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: ($namespace)
                labels:
                  app.kubernetes.io/instance: ($falco_name)
              status:
                (containerStatuses[?name == 'artifact-operator'].ready): [true]

    - name: "Step 08: Delete-plugin-blocked"
      description: |
        Request Plugin deletion without waiting. The Rulesfile still depends on it,
        so removal must remain blocked after the Pod replacement.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: PLUGIN_NAME
                value: ($plugin_name)
            content: |
              bash ../../common/scripts/check_plugin_deletion_blocked.sh

    - name: "Step 09: Assert-deletion-blocked-condition-surfaced"
      description: |
        Verify DeletionBlocked=True with reason PluginConfigStillRequired on the
        parent Plugin. Hold and re-assert to detect a transiently correct condition.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              metadata:
                name: ($plugin_name)
                namespace: ($namespace)
                (contains(finalizers, 'artifact.falcosecurity.dev/node-objects-in-use')): true
              status:
                (conditions[?type == 'DeletionBlocked']):
                  - status: 'True'
                    reason: PluginConfigStillRequired
        - sleep:
            duration: 10s
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              metadata:
                name: ($plugin_name)
                namespace: ($namespace)
                (contains(finalizers, 'artifact.falcosecurity.dev/node-objects-in-use')): true
              status:
                (conditions[?type == 'DeletionBlocked']):
                  - status: 'True'
                    reason: PluginConfigStillRequired

    - name: "Step 10: Delete-rulesfile"
      description: |
        Delete the Rulesfile. Its removal drops the structural dependency, so
        the per-node artifact operator can now remove the plugin config and
        release its own ArtifactNode finalizer.
        kubectl --wait=false fires the delete without blocking: the ArtifactNode
        wait below is the actual completion signal, avoiding chainsaw's implicit
        object-gone wait which could time out if Rulesfile cleanup is slow.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: rulesfiles.artifact.falcosecurity.dev
              - name: NAME
                value: ($rulesfile_name)
            content: bash ../../common/scripts/delete_resource_no_wait.sh
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: ArtifactNode
            namespace: ($namespace)
            selector: (join('', ['artifact.falcosecurity.dev/parent=', $rulesfile_name]))
            for:
              deletion: {}

    - name: "Step 11: Wait-plugin-node-object-deleted"
      description: |
        Isolates per-node cleanup from the final parent deletion below. If THIS
        step is the one that stalls, the artifact-operator sidecar on the node
        isn't removing its ArtifactNode finalizer: check that container's
        logs, not the instance-operator's.
      try:
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: ArtifactNode
            namespace: ($namespace)
            selector: (join('', ['artifact.falcosecurity.dev/parent=', $plugin_name]))
            for:
              deletion: {}

    - name: "Step 12: Wait-plugin-deleted"
      description: |
        With the last ArtifactNode already gone (Step 11), node-objects-in-use
        must already be clear or clear on the very next reconcile; this wait
        should resolve almost immediately.
      try:
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: Plugin
            name: ($plugin_name)
            namespace: ($namespace)
            for:
              deletion: {}

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
