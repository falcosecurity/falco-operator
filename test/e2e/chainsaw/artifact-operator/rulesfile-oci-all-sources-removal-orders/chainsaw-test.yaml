apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-oci-all-sources-removal-orders
spec:
  description: |
    Validates that removing sources from a Rulesfile that has all three sources (inline,
    configmap, OCI) in every possible order still leaves the surviving sources correctly
    programmed, and that dependencies from each source are independent.

    Each source carries a DISTINCT met requirement:
      - Inline YAML:   required_engine_version: "0.0.1"  (engine cap, satisfied by any real Falco)
      - ConfigMap YAML: required_plugin_versions: [{json, 0.7.0}]  (json plugin dep)
      - OCI config layer: dependencies: [{container, 0.1.0}]  (container plugin dep)

    Both plugins (json and container) are installed from the local OCI registry: no external
    registries are contacted. Both are verified as loaded in Falco's /versions before the
    Rulesfile is created: all requirements are met by real plugin data.

    All 6 permutations (3! = 6) are executed in sequence within this single test.
    Between permutations the Rulesfile is restored to all three sources.

    Key observations:
    - After each removal, the remaining sources' requirements are re-merged and re-checked.
      DependenciesSatisfied=True and Programmed=True persist as long as at least one source
      with satisfiable requirements remains.
    - When all sources are removed, enforceRulesfileCompatibility removes the
      DependenciesSatisfied condition and returns skip=false, so ensureRulesfile's own
      stale-entry cleanup runs: the last remaining file is deleted from disk and its
      *ArtifactProgrammed condition is removed too. With no conditions left to gate on,
      Programmed becomes False with reason ProgramFailed ("no conditions to gate on").

    Permutation table (I=inline, C=configmap, O=oci):
      P1: I → C → O
      P2: I → O → C
      P3: C → I → O
      P4: C → O → I
      P5: O → I → C
      P6: O → C → I

  bindings:
    - name: falco_name
      value: falco-oci-all-sources-removal-orders-test
    - name: rulesfile_name
      value: rulesfile-oci-all-sources-test
    - name: rules_cm_name
      value: rulesfile-oci-all-sources-cm
    - name: test_name
      value: rulesfile-oci-all-sources-removal-orders
    - name: oci_file
      value: 50-01-rulesfile-oci-all-sources-test-oci.yaml
    - name: cm_file
      value: 50-02-rulesfile-oci-all-sources-test-configmap.yaml
    - name: inline_file
      value: 50-03-rulesfile-oci-all-sources-test-inline.yaml

  steps:
    # ── SETUP ──────────────────────────────────────────────────────────────────

    - name: "Step 01: Create-falco"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Install-json-plugin"
      use:
        template: ../../common/_step_templates/apply-assert-plugin.yaml
        with:
          bindings:
            - name: plugin_name
              value: json
            - name: namespace
              value: ($namespace)
            - name: plugin_oci_repo
              value: falco-test/plugin-json
            - name: plugin_oci_tag
              value: latest
            - name: plugin_oci_registry
              value: registry.oci-registry.svc.cluster.local:5000
            - name: plugin_plain_http
              value: true

    - name: "Step 03: Install-container-plugin"
      use:
        template: ../../common/_step_templates/apply-assert-plugin.yaml
        with:
          bindings:
            - name: plugin_name
              value: container
            - name: namespace
              value: ($namespace)
            - name: plugin_oci_repo
              value: falco-test/plugin-container
            - name: plugin_oci_tag
              value: latest
            - name: plugin_oci_registry
              value: registry.oci-registry.svc.cluster.local:5000
            - name: plugin_plain_http
              value: true

    - name: "Step 04: Verify-json-loaded-in-falco"
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: PLUGIN_NAME
                value: json
            content: |
              bash ../../common/scripts/check_falco_plugin_loaded.sh

    - name: "Step 05: Verify-container-loaded-in-falco"
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: PLUGIN_NAME
                value: container
            content: |
              bash ../../common/scripts/check_falco_plugin_loaded.sh

    - name: "Step 06: Create-rules-configmap"
      use:
        template: ../../common/_step_templates/apply-configmap-from-file.yaml
        with:
          bindings:
            - name: configmap_name
              value: ($rules_cm_name)
            - name: namespace
              value: ($namespace)
            - name: source_file
              value: simple-rules.yaml

    - name: "Step 07: Create-rulesfile-all-three-sources"
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                configMapRef:
                  name: rulesfile-oci-all-sources-cm
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-all-sources
                    tag: latest
                  registry:
                    name: registry.oci-registry.svc.cluster.local:5000
                    plainHTTP: true
                inlineRules:
                  - required_engine_version: "0.0.1"
                  - rule: Chainsaw oci-all-sources inline rule
                    desc: Inline rule declaring engine version requirement.
                    condition: "evt.type = execve"
                    output: "process=%proc.cmdline marker=inline-engine-req"
                    priority: DEBUG
                    tags: [test, chainsaw, oci]

    - name: "Step 08: Assert-initial-all-satisfied"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 3
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (installedArtifacts[?medium == 'oci']):
                  - path: /etc/falco/rules.d/50-01-rulesfile-oci-all-sources-test-oci.yaml
                    priority: 50
                (installedArtifacts[?medium == 'configmap']):
                  - path: /etc/falco/rules.d/50-02-rulesfile-oci-all-sources-test-configmap.yaml
                    priority: 50
                (installedArtifacts[?medium == 'inline']):
                  - path: /etc/falco/rules.d/50-03-rulesfile-oci-all-sources-test-inline.yaml
                    priority: 50

    - name: "Step 09: Assert-oci-file-present"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($oci_file)
            - name: should_exist
              value: "true"

    - name: "Step 10: Assert-cm-file-present"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($cm_file)
            - name: should_exist
              value: "true"

    - name: "Step 11: Assert-inline-file-present"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($inline_file)
            - name: should_exist
              value: "true"

    # ── P1: I → C → O ──────────────────────────────────────────────────────────

    - name: "P1-Step01: Remove-inline"
      description: P1 step 1/3, remove inline; CM+OCI remain (json dep + container dep met).
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                inlineRules: null
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'InlineArtifactProgrammed'])): 0
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 2
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'InlineArtifactProgrammed'])): 0

    - name: "P1-Step02: Assert-inline-file-absent"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($inline_file)
            - name: should_exist
              value: "false"

    - name: "P1-Step03: Remove-configmap"
      description: P1 step 2/3, remove CM; OCI alone remains (container dep met).
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                configMapRef: null
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'ConfigMapArtifactProgrammed'])): 0
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 1
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'ConfigMapArtifactProgrammed'])): 0

    - name: "P1-Step04: Assert-cm-file-absent"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($cm_file)
            - name: should_exist
              value: "false"

    - name: "P1-Step05: Remove-oci"
      description: |
        P1 step 3/3, remove OCI; no sources remain. DependenciesSatisfied and
        OCIArtifactProgrammed are removed, the OCI file is deleted from disk, and Programmed
        becomes False with reason ProgramFailed.
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                ociArtifact: null
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (length(conditions[?type == 'DependenciesSatisfied'] || `[]`)): 0
                (length(conditions[?type == 'OCIArtifactProgrammed'] || `[]`)): 0
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    reason: ProgramFailed
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 0
                (length(conditions[?type == 'DependenciesSatisfied'] || `[]`)): 0
                (length(conditions[?type == 'OCIArtifactProgrammed'] || `[]`)): 0
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    reason: ProgramFailed

    - name: "P1-Step06: Assert-oci-file-absent"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($oci_file)
            - name: should_exist
              value: "false"

    # ── P1 Restore ────────────────────────────────────────────────────────

    - name: "P1-Restore: Restore-all-three-sources"
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                configMapRef:
                  name: rulesfile-oci-all-sources-cm
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-all-sources
                    tag: latest
                  registry:
                    name: registry.oci-registry.svc.cluster.local:5000
                    plainHTTP: true
                inlineRules:
                  - required_engine_version: "0.0.1"
                  - rule: Chainsaw oci-all-sources inline rule
                    desc: Inline rule declaring engine version requirement.
                    condition: "evt.type = execve"
                    output: "process=%proc.cmdline marker=inline-engine-req"
                    priority: DEBUG
                    tags: [test, chainsaw, oci]

    - name: "P1-Restore-Assert: Assert-all-three-restored"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 3
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'

    # ── P2: I → O → C ──────────────────────────────────────────────────────────

    - name: "P2-Step01: Remove-inline"
      description: P2 step 1/3, remove inline; OCI+CM remain (container dep + json dep met).
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                inlineRules: null
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'InlineArtifactProgrammed'])): 0
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 2
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'InlineArtifactProgrammed'])): 0

    - name: "P2-Step02: Assert-inline-file-absent"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($inline_file)
            - name: should_exist
              value: "false"

    - name: "P2-Step03: Remove-oci"
      description: P2 step 2/3, remove OCI; CM alone remains (json dep met).
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                ociArtifact: null
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'OCIArtifactProgrammed'])): 0
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 1
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'OCIArtifactProgrammed'])): 0

    - name: "P2-Step04: Assert-oci-file-absent"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($oci_file)
            - name: should_exist
              value: "false"

    - name: "P2-Step05: Remove-configmap"
      description: |
        P2 step 3/3, remove CM; no sources remain. DependenciesSatisfied and
        ConfigMapArtifactProgrammed are removed, the CM file is deleted from disk, and
        Programmed becomes False with reason ProgramFailed.
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                configMapRef: null
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (length(conditions[?type == 'DependenciesSatisfied'] || `[]`)): 0
                (length(conditions[?type == 'ConfigMapArtifactProgrammed'] || `[]`)): 0
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    reason: ProgramFailed
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 0
                (length(conditions[?type == 'DependenciesSatisfied'] || `[]`)): 0
                (length(conditions[?type == 'ConfigMapArtifactProgrammed'] || `[]`)): 0
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    reason: ProgramFailed

    - name: "P2-Step06: Assert-cm-file-absent"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: ($cm_file)
            - name: should_exist
              value: "false"

    # ── P2 Restore ────────────────────────────────────────────────────────

    - name: "P2-Restore: Restore-all-three-sources"
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                configMapRef:
                  name: rulesfile-oci-all-sources-cm
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-all-sources
                    tag: latest
                  registry:
                    name: registry.oci-registry.svc.cluster.local:5000
                    plainHTTP: true
                inlineRules:
                  - required_engine_version: "0.0.1"
                  - rule: Chainsaw oci-all-sources inline rule
                    desc: Inline rule declaring engine version requirement.
                    condition: "evt.type = execve"
                    output: "process=%proc.cmdline marker=inline-engine-req"
                    priority: DEBUG
                    tags: [test, chainsaw, oci]

    - name: "P2-Restore-Assert: Assert-all-three-restored"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 3
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
