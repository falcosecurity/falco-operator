apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: artifact-node-self-healing
spec:
  description: |
    Exercises the instance operators' self-healing of an ArtifactNode that's mutated
    out-of-band, not via a Node or CR selector change (that's artifact-node-lifecycle's
    scope), but via direct manipulation of the ArtifactNode object itself, simulating a
    crash, bug, or stray manual kubectl action. Starts with one KWOK-simulated fake Node
    and adds a second for the identity-collision scenario. Minimal Falco CR/pod stubs make
    ListMatchingFalcoNodes include these nodes.

    Plugin exercises the first two scenarios below, which prove a generic,
    kind-agnostic mechanism (the ArtifactNode watch's owner-routing via
    EnqueueRequestForOwner, and EnforceNodeObjectMeta's restoration logic in
    internal/pkg/controllerhelper/nodeobject.go); artifact-node-lifecycle already
    proves EnsureNodeObject is called correctly per-kind for Rulesfile/Config, so duplicating
    that here for a mechanism that doesn't vary by kind would add steps without adding signal.

    Because no real per-node sidecar ever reconciles an ArtifactNode on a fake node, it keeps
    its CRD-defaulted Programmed=Unknown/Pending condition forever. The Falco CR and pod are
    minimal stubs: no actual Falco runs; only the label is checked by ListMatchingFalcoNodes.

    Scenarios:
    1. Delete the Plugin's ArtifactNode directly (not via node/selector change). Assert it
       gets recreated: EnqueueRequestForOwner (the ArtifactNode watch) must notice the delete
       event and requeue the owning Plugin, whose reconcile recreates it via EnsureNodeObject.
    2. Corrupt the same ArtifactNode's artifact.falcosecurity.dev/kind label directly. Assert
       it gets restored: EnforceNodeObjectMeta must detect the drift on the next reconcile and
       patch it back. Only the label is corrupted, not the owner reference: corrupting the
       owner reference would break the very signal EnqueueRequestForOwner needs to route the
       watch event to the right parent, which is the mechanism this scenario is trying to
       observe self-healing through, not the one under test.
    3. Create two Config/node assignments whose old concatenated names collide. Verify
       distinct ArtifactNode names and UIDs, then remove one parent without changing the
       other assignment. These KWOK assertions cover Kubernetes identity, not Falco runtime.

  bindings:
    - name: plugin_name
      value: node-self-healing-plugin
    - name: test_name
      value: artifact-node-self-healing
    - name: oci_registry
      value: registry.oci-registry.svc.cluster.local:5000
    - name: node_name
      value: (join('-', ['self-healing-node', $namespace]))
    - name: falco_name
      value: self-healing-falco
    - name: falco_pod_name
      value: (join('-', ['falco-pod', $namespace]))
    - name: artifact_node_name
      value: (join('--', ['plugin', $plugin_name, $node_name]))
    - name: collision_node_name
      value: (join('--', ['branch', $node_name]))
    - name: collision_config_a
      value: collision-config--branch
    - name: collision_config_b
      value: collision-config

  steps:
    - name: "Step 01: Create-fake-node"
      description: Create the KWOK-managed node selected by this test.
      use:
        template: ../../common/_step_templates/apply-fake-node.yaml
        with:
          bindings:
            - name: node_name
              value: ($node_name)
            - name: node_arch
              value: amd64
            - name: node_group
              value: ($namespace)

    - name: "Step 01b: Create-falco-cr"
      description: Minimal Falco CR, no actual Falco runs; only its name is used by ListMatchingFalcoNodes.
      try:
        - apply:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: ($falco_name)
                namespace: ($namespace)

    - name: "Step 01c: Create-falco-pod-on-fake-node"
      description: Stub pod pinned to the fake node so ListMatchingFalcoNodes returns it; KWOK advances it to Running.
      use:
        template: ../../common/_step_templates/create-falco-pod-on-fake-node.yaml
        with:
          bindings:
            - name: pod_name
              value: ($falco_pod_name)
            - name: falco_name
              value: ($falco_name)
            - name: node_name
              value: ($node_name)

    - name: "Step 02: Create-plugin"
      description: OCI-sourced Plugin (Plugin has no inline source option), selector scoped to this test's fake node.
      try:
        - apply:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              metadata:
                name: ($plugin_name)
                namespace: ($namespace)
              spec:
                ociArtifact:
                  image:
                    repository: falco-test/plugin-container
                    tag: latest
                  registry:
                    name: ($oci_registry)
                    plainHTTP: true
                selector:
                  matchLabels:
                    chainsaw-node-group: ($namespace)

    - name: "Step 03: Assert-artifact-node-created"
      description: |
        The fake node matches the selector, so the aggregator creates one ArtifactNode. No
        real per-node sidecar ever reconciles it, so it keeps the CRD default
        Programmed=Unknown/Pending.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: (join('--', ['plugin', $plugin_name, $node_name]))
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($plugin_name)
                  artifact.falcosecurity.dev/kind: plugin
              spec:
                nodeName: ($node_name)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'Unknown'
                    reason: Pending

    - name: "Step 04: Delete-artifactnode-directly-and-assert-recreated"
      description: |
        Scenario 1. Deletes the ArtifactNode itself, bypassing node/selector changes entirely,
        simulates a crash, bug, or stray manual `kubectl delete` of a managed child object, then
        confirms the ArtifactNode watch (EnqueueRequestForOwner) noticed the delete event and
        requeued the Plugin, whose reconcile recreates it via EnsureNodeObject.

        The UID is captured first because chainsaw's own `delete:` step can't be used here: it
        waits for the object to be absent by namespace+name, which can never observe "gone" once
        EnsureNodeObject has already recreated it under the same name (see
        delete_resource_no_wait.sh's doc comment). Comparing UIDs before and after instead proves
        an actual delete-and-recreate cycle happened, not just that an object with an acceptable
        shape exists at this name (which would also be true if the original object had simply
        never been deleted at all), and the recreated object is a fresh one (a new UID, confirmed
        first), so it's back to the CRD-defaulted Programmed=Unknown/Pending.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: artifactnodes.artifact.falcosecurity.dev
              - name: NAME
                value: ($artifact_node_name)
            content: |
              bash ../../common/scripts/get_resource_uid.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true
            outputs:
              - name: artifact_node_uid_before
                value: (json_parse($stdout).uid)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: artifactnodes.artifact.falcosecurity.dev
              - name: NAME
                value: ($artifact_node_name)
            content: |
              bash ../../common/scripts/delete_resource_no_wait.sh
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: artifactnodes.artifact.falcosecurity.dev
              - name: NAME
                value: ($artifact_node_name)
              - name: OLD_UID
                value: ($artifact_node_uid_before)
            content: |
              bash ../../common/scripts/wait_for_resource_uid_changed.sh
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: (join('--', ['plugin', $plugin_name, $node_name]))
                namespace: ($namespace)
              spec:
                nodeName: ($node_name)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'Unknown'
                    reason: Pending

    - name: "Step 05: Corrupt-artifactnode-label"
      description: |
        Scenario 2. A JSON merge patch to metadata.labels only touches the key given:
        artifact.falcosecurity.dev/parent and artifact.falcosecurity.dev/node are left alone,
        isolating this to exactly the drift EnforceNodeObjectMeta needs to detect and fix.
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: (join('--', ['plugin', $plugin_name, $node_name]))
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/kind: corrupted-by-test

    - name: "Step 06: Assert-artifactnode-label-restored-after-drift"
      description: Scenario 2. EnforceNodeObjectMeta must have detected the mismatch and patched the label back.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: (join('--', ['plugin', $plugin_name, $node_name]))
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/kind: plugin

    - name: "Step 07: Delete-plugin"
      description: Delete the Plugin parent to start cleanup of its node assignment.
      try:
        - delete:
            ref:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              name: ($plugin_name)
              namespace: ($namespace)

    - name: "Step 08: Wait-for-artifactnode-cleanup"
      description: Wait until the Plugin's ArtifactNode has been removed.
      try:
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: ArtifactNode
            namespace: ($namespace)
            selector: (join('', ['artifact.falcosecurity.dev/parent=', $plugin_name]))
            for:
              deletion: {}

    - name: "Step 08b: Create-collision-node"
      description: The second node name moves the same delimiter-containing segment from the parent name to the node name.
      use:
        template: ../../common/_step_templates/apply-fake-node.yaml
        with:
          bindings:
            - name: node_name
              value: ($collision_node_name)
            - name: node_arch
              value: amd64
            - name: node_group
              value: ($namespace)

    - name: "Step 08c: Create-falco-pod-on-collision-node"
      description: A second KWOK pod makes the second node eligible without introducing a real Falco process.
      use:
        template: ../../common/_step_templates/create-falco-pod-on-fake-node.yaml
        with:
          bindings:
            - name: pod_name
              value: (join('-', ['collision-pod', $namespace]))
            - name: falco_name
              value: ($falco_name)
            - name: node_name
              value: ($collision_node_name)

    - name: "Step 08d: Create-first-colliding-config"
      description: Assign the delimiter-containing parent name only to the original node.
      use:
        template: ../../common/_step_templates/apply-config.yaml
        with:
          bindings:
            - name: config_name
              value: ($collision_config_a)
            - name: namespace
              value: ($namespace)
            - name: config_spec
              value:
                config:
                  log_level: info
                selector:
                  matchLabels:
                    kubernetes.io/hostname: ($node_name)

    - name: "Step 08e: Create-second-colliding-config"
      description: Its old ArtifactNode name would equal the first assignment's name, despite a different parent and node.
      use:
        template: ../../common/_step_templates/apply-config.yaml
        with:
          bindings:
            - name: config_name
              value: ($collision_config_b)
            - name: namespace
              value: ($namespace)
            - name: config_spec
              value:
                config:
                  log_level: debug
                selector:
                  matchLabels:
                    kubernetes.io/hostname: ($collision_node_name)

    - name: "Step 08f: Assert-distinct-assignment-identities"
      description: |
        Check complete owner/node assignments and compare actual names and UIDs within
        this step. Sequential label assertions alone could pass if one broken object
        repeatedly switched between the two parents.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($collision_config_a)
                  artifact.falcosecurity.dev/kind: config
                ownerReferences:
                  - kind: Config
                    name: ($collision_config_a)
                    controller: true
              spec:
                nodeName: ($node_name)
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($collision_config_b)
                  artifact.falcosecurity.dev/kind: config
                ownerReferences:
                  - kind: Config
                    name: ($collision_config_b)
                    controller: true
              spec:
                nodeName: ($collision_node_name)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: artifactnodes.artifact.falcosecurity.dev
              - name: SELECTOR
                value: (join('', ['artifact.falcosecurity.dev/kind=config,artifact.falcosecurity.dev/parent=', $collision_config_a]))
            content: |
              bash ../../common/scripts/get_resource_uid.sh
            check:
              (json_parse($stdout).status == 'success'): true
            outputs:
              - name: first_assignment_name
                value: (json_parse($stdout).name)
              - name: first_assignment_uid
                value: (json_parse($stdout).uid)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: artifactnodes.artifact.falcosecurity.dev
              - name: SELECTOR
                value: (join('', ['artifact.falcosecurity.dev/kind=config,artifact.falcosecurity.dev/parent=', $collision_config_b]))
            content: |
              bash ../../common/scripts/get_resource_uid.sh
            check:
              (json_parse($stdout).status == 'success'): true
              (json_parse($stdout).name != $first_assignment_name): true
              (json_parse($stdout).uid != $first_assignment_uid): true

    - name: "Step 08g: Remove-first-config-and-preserve-second-assignment"
      description: Deleting one parent must not steal, delete or recreate the other parent's ArtifactNode.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: artifactnodes.artifact.falcosecurity.dev
              - name: SELECTOR
                value: (join('', ['artifact.falcosecurity.dev/kind=config,artifact.falcosecurity.dev/parent=', $collision_config_b]))
            content: |
              bash ../../common/scripts/get_resource_uid.sh
            outputs:
              - name: remaining_assignment_uid
                value: (json_parse($stdout).uid)
        - delete:
            ref:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              name: ($collision_config_a)
              namespace: ($namespace)
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: ArtifactNode
            namespace: ($namespace)
            selector: (join('', ['artifact.falcosecurity.dev/parent=', $collision_config_a]))
            for:
              deletion: {}
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: artifactnodes.artifact.falcosecurity.dev
              - name: SELECTOR
                value: (join('', ['artifact.falcosecurity.dev/kind=config,artifact.falcosecurity.dev/parent=', $collision_config_b]))
            content: |
              bash ../../common/scripts/get_resource_uid.sh
            check:
              (json_parse($stdout).status == 'success'): true
              (json_parse($stdout).uid == $remaining_assignment_uid): true

    - name: "Step 08h: Remove-second-config"
      description: The remaining assignment must still complete its own ordinary parent cleanup.
      try:
        - delete:
            ref:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              name: ($collision_config_b)
              namespace: ($namespace)
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: ArtifactNode
            namespace: ($namespace)
            selector: (join('', ['artifact.falcosecurity.dev/parent=', $collision_config_b]))
            for:
              deletion: {}

    - name: "Step 09: Delete-fake-node-and-falco-cr"
      description: Delete both fake Nodes and the Falco CR created by this test.
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Node
              name: ($node_name)
        - delete:
            ref:
              apiVersion: v1
              kind: Node
              name: ($collision_node_name)
        - delete:
            ref:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              name: ($falco_name)
              namespace: ($namespace)

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
    - description: |
        Best-effort cleanup of the fake Node, cluster-scoped, so a mid-test failure must not
        leave it behind for the next run.
      delete:
        ref:
          apiVersion: v1
          kind: Node
          name: ($node_name)
    - description: Remove the second cluster-scoped collision-test Node after a failure.
      delete:
        ref:
          apiVersion: v1
          kind: Node
          name: ($collision_node_name)
