apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-basic-inline
spec:
  description: |
    Validates the full inline Rulesfile lifecycle against a real Falco instance:
    1. Create a Falco DaemonSet.
    2. Create a Rulesfile with inline rules (required_engine_version=0.30.0, always met).
    3. Assert DependenciesSatisfied=True, InlineArtifactProgrammed=True, Programmed=True
       on both the Rulesfile and ArtifactNode.
    4. Assert the rules file is present on the node filesystem.
    5. Delete the Rulesfile.
    6. Assert the ArtifactNode is garbage-collected.
    7. Assert the rules file is absent from the node filesystem.

  bindings:
    - name: falco_name
      value: falco-rulesfile-basic-inline-test
    - name: rulesfile_name
      value: rulesfile-basic-inline-test
    - name: test_name
      value: rulesfile-basic-inline

  steps:
    - name: "Step 01: Create-falco"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-rulesfile"
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                inlineRules:
                  - required_engine_version: "0.30.0"
                  - rule: Chainsaw basic inline rule
                    desc: Minimal rule for the chainsaw rulesfile-basic-inline test.
                    condition: "evt.type = execve"
                    output: "process=%proc.cmdline"
                    priority: DEBUG
                    tags: [test, chainsaw]

    - name: "Step 03: Assert-conditions"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'

    - name: "Step 04: Assert-file-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-03-rulesfile-basic-inline-test-inline.yaml
            - name: should_exist
              value: "true"

    - name: "Step 05: Delete-rulesfile"
      try:
        - delete:
            ref:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              name: ($rulesfile_name)
              namespace: ($namespace)
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: ArtifactNode
            namespace: ($namespace)
            selector: (join('', ['artifact.falcosecurity.dev/parent=', $rulesfile_name]))
            for:
              deletion: {}

    - name: "Step 06: Assert-file-absent-from-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-03-rulesfile-basic-inline-test-inline.yaml
            - name: should_exist
              value: "false"

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
