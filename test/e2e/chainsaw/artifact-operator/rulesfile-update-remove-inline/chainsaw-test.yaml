apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-update-remove-inline
spec:
  description: |
    Validates that nulling out inlineRules removes the inline file from disk
    while leaving the ConfigMap file untouched.

    Setup: Falco (real, enforce mode). The ConfigMap source has no requirements.
    After the inline source is removed the remaining CM alone still satisfies
    requirements and the enforce gate passes, allowing cleanup to run.

    After patching inlineRules to null:
    - InlineArtifactProgrammed condition is removed from status.
    - ConfigMapArtifactProgrammed=True remains.
    - DependenciesSatisfied=True remains.
    - Programmed=True remains.
    - installedArtifacts drops from 2 to 1.
    - The inline disk file is deleted; the ConfigMap disk file remains.

  bindings:
    - name: falco_name
      value: falco-update-remove-inline-test
    - name: rulesfile_name
      value: rulesfile-update-remove-inline-test
    - name: rules_cm_name
      value: rulesfile-update-remove-inline-rules-cm
    - name: test_name
      value: rulesfile-update-remove-inline

  steps:
    - name: "Step 01: Create-falco"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-rules-configmap"
      use:
        template: ../../common/_step_templates/apply-configmap-from-file.yaml
        with:
          bindings:
            - name: configmap_name
              value: ($rules_cm_name)
            - name: namespace
              value: ($namespace)
            - name: source_file
              value: simple-rules.yaml

    - name: "Step 03: Create-rulesfile-inline-and-cm"
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                configMapRef:
                  name: rulesfile-update-remove-inline-rules-cm
                inlineRules:
                  - required_engine_version: "0.30.0"
                  - rule: Chainsaw update-remove-inline inline rule
                    desc: Inline rule to be removed in the update step.
                    condition: "evt.type = execve"
                    output: "process=%proc.cmdline marker=inline-removed"
                    priority: DEBUG
                    tags: [test, chainsaw, update]

    - name: "Step 04: Assert-initial-both-sources-conditions"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 2
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (installedArtifacts[?medium == 'inline']):
                  - path: /etc/falco/rules.d/50-03-rulesfile-update-remove-inline-test-inline.yaml
                    priority: 50
                (installedArtifacts[?medium == 'configmap']):
                  - path: /etc/falco/rules.d/50-02-rulesfile-update-remove-inline-test-configmap.yaml
                    priority: 50

    - name: "Step 05: Assert-inline-file-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-03-rulesfile-update-remove-inline-test-inline.yaml
            - name: should_exist
              value: "true"

    - name: "Step 06: Assert-cm-file-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-02-rulesfile-update-remove-inline-test-configmap.yaml
            - name: should_exist
              value: "true"

    - name: "Step 07: Remove-inlineRules-from-spec"
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                inlineRules: null

    - name: "Step 08: Assert-cm-only-conditions-after-removal"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'InlineArtifactProgrammed'])): 0
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 1
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (length(conditions[?type == 'InlineArtifactProgrammed'])): 0
                (length(installedArtifacts[?medium == 'inline'])): 0
                (installedArtifacts[?medium == 'configmap']):
                  - path: /etc/falco/rules.d/50-02-rulesfile-update-remove-inline-test-configmap.yaml
                    priority: 50

    - name: "Step 09: Assert-inline-file-deleted-from-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-03-rulesfile-update-remove-inline-test-inline.yaml
            - name: should_exist
              value: "false"

    - name: "Step 10: Assert-cm-file-still-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-02-rulesfile-update-remove-inline-test-configmap.yaml
            - name: should_exist
              value: "true"

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
