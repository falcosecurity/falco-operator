apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-warmsync-recovers-spechash
spec:
  description: |
    WarmSync observes installed files without importing SpecHash from Kubernetes
    status. The restarted process fetches the current pinned OCI artifact through
    the central cache and rebuilds its in-memory identity during reconciliation.
    Already-correct file contents must not be physically rewritten.

    Restart only the artifact-operator container, preserving the Pod UID and its
    emptyDir files. Then make a valid transport-only OCI spec change (empty auth,
    still anonymous) and require a fresh generation with matching parent and
    installed SpecHash. This proves current reconciliation rather than accepting
    the pre-restart Programmed=True status. The file checksum must remain unchanged.

    The new process must emit no "Rulesfile OCI artifact written to disk" log.
    This is a no-rewrite assertion, not a no-fetch assertion. The historical test
    name is retained; recovering installed identity from status is no longer part
    of the contract.

  bindings:
    - name: falco_name
      value: falco-warmsync-spechash-test
    - name: rulesfile_name
      value: rulesfile-warmsync-spechash-test
    - name: test_name
      value: rulesfile-warmsync-recovers-spechash
    - name: oci_registry
      value: registry.oci-registry.svc.cluster.local:5000

  steps:
    - name: "Step 01: Create-falco"
      description: Create Falco with the artifact-operator sidecar and shared emptyDir files.
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-rulesfile"
      description: |
        falco-test/rulesfile-engine-req-met declares only an engine-version requirement
        (always satisfied), so this needs no plugin installed first.
      try:
        - apply:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-engine-req-met
                    tag: latest
                  registry:
                    name: ($oci_registry)
                    plainHTTP: true
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'

    - name: "Step 03: Assert-file-on-disk"
      description: Confirm the initial current OCI Rulesfile is present before restarting the sidecar.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: DIR
                value: /etc/falco/rules.d
              - name: FILE_PATTERN
                value: ($rulesfile_name)
            content: |
              bash ../../common/scripts/check_file_on_node.sh

    - name: "Step 04: Restart-artifact-operator-container-in-place"
      description: |
        Capture the file checksum and Pod UID, restart only the sidecar, and verify
        both are unchanged. An anonymous auth object then changes the OCI SpecHash
        without changing the artifact bytes. Require generation 2 on both parent
        and ArtifactNode, with the freshly observed installed SpecHash matching
        the current parent metadata. No status from before restart can satisfy this.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: FILE_PATH
                value: (join('', ['/etc/falco/rules.d/50-01-', $rulesfile_name, '-oci.yaml']))
            content: bash ../../common/scripts/check_file_checksum_on_node.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true
            outputs:
              - name: installed_rules_checksum
                value: (json_parse($stdout).checksum)
              - name: original_pod_name
                value: (json_parse($stdout).pod)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: pods
              - name: NAME
                value: ($original_pod_name)
            content: bash ../../common/scripts/get_resource_uid.sh
            outputs:
              - name: original_pod_uid
                value: (json_parse($stdout).uid)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
            content: bash ../../common/scripts/restart_artifact_operator_container.sh
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: pods
              - name: NAME
                value: ($original_pod_name)
            content: bash ../../common/scripts/get_resource_uid.sh
            check:
              (json_parse($stdout).uid == $original_pod_uid): true
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: FILE_PATH
                value: (join('', ['/etc/falco/rules.d/50-01-', $rulesfile_name, '-oci.yaml']))
            content: bash ../../common/scripts/check_file_checksum_on_node.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true
              (json_parse($stdout).checksum == $installed_rules_checksum): true
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                ociArtifact:
                  registry:
                    auth: {}
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
                generation: 2
              status:
                observedGeneration: 2
                (length(artifactMeta.specHash || '')): 64
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                    observedGeneration: 2
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                    observedGeneration: 2
        - command:
            entrypoint: kubectl
            env:
              - name: RULESFILE_NAME
                value: ($rulesfile_name)
              - name: NAMESPACE
                value: ($namespace)
            args:
              - get
              - rulesfile
              - $RULESFILE_NAME
              - --namespace
              - $NAMESPACE
              - --output=json
            check:
              (length(json_parse($stdout).status.artifactMeta.specHash || '')): 64
            outputs:
              - name: current_spec_hash
                value: (json_parse($stdout).status.artifactMeta.specHash)
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (installedArtifacts[0].medium): oci
                (installedArtifacts[0].specHash): ($current_spec_hash)
                (installedArtifacts[0].contentHash): ($installed_rules_checksum)
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                    observedGeneration: 2
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                    observedGeneration: 2
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: FILE_PATH
                value: (join('', ['/etc/falco/rules.d/50-01-', $rulesfile_name, '-oci.yaml']))
            content: bash ../../common/scripts/check_file_checksum_on_node.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true
              (json_parse($stdout).checksum == $installed_rules_checksum): true

    - name: "Step 05: Assert-no-rewrite-after-restart"
      description: |
        The restarted process's own logs cover both its startup reconciliation and
        the confirmed generation-2 update. Fetching current OCI content is expected;
        writing identical content again is not. Poll for the absence of the physical
        write success log rather than claiming that no fetch happened.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: CONTAINER
                value: artifact-operator
              - name: PATTERN
                value: Rulesfile OCI artifact written to disk
              - name: MAX_RETRIES
                value: "20"
            content: |
              bash ../../common/scripts/check_log_absent_on_pod.sh

    - name: "Step 06: Assert-still-programmed-and-file-present"
      description: Verify the freshly reconciled Rulesfile remains programmed and its file is present.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                    observedGeneration: 2
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                    observedGeneration: 2
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: DIR
                value: /etc/falco/rules.d
              - name: FILE_PATTERN
                value: ($rulesfile_name)
            content: |
              bash ../../common/scripts/check_file_on_node.sh

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
