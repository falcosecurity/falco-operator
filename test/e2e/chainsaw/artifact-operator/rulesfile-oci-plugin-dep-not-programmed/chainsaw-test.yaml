apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-oci-plugin-dep-not-programmed
spec:
  description: |
    Validates that a Plugin which can never be programmed (bad OCI tag) is assigned
    to the nodes like any selected Plugin, but is never installed on them, and that
    it can still be deleted: the nodes' artifact operators have no files to remove
    and simply drop their entries, which releases the node-objects-in-use finalizer.

    The OCI artifact (falco-test/rulesfile-official) declares a container plugin
    dependency. The container Plugin is created with a nonexistent OCI tag so it
    can never be fetched or programmed. Because the plugin is not programmed, the
    Rulesfile's dependency is unmet and the Rulesfile itself is not programmed.

    Scenario:
      1. Create Falco in enforce mode.
      2. Create the Rulesfile: dependency unmet, Programmed=False.
      3. Create the Plugin "container" with a bad OCI tag: it can never be
         programmed (ArtifactMeta cannot be fetched).
      4. Assert the Rulesfile is not programmed and the Plugin is not programmed
         with reason OCIArtifactProgramFailed.
      5. Assert the nodes' ArtifactNodes list the Plugin (assignment follows the
         selector, not whether the Plugin could be fetched) and that no node reports
         any file installed for it: fetchAndCacheArtifactMeta fails, so ObservedGeneration
         is never advanced and the artifact operators stay deferred.
      6. Delete the Plugin: the assignment controller drops it from the nodes, the
         artifact operators withdraw their entries, and the deletion completes.

  bindings:
    - name: falco_name
      value: falco-oci-plugin-dep-not-programmed-test
    - name: rulesfile_name
      value: rulesfile-oci-plugin-dep-not-programmed-test
    - name: plugin_name
      value: container
    - name: test_name
      value: rulesfile-oci-plugin-dep-not-programmed
    - name: oci_registry
      value: registry.oci-registry.svc.cluster.local:5000

  steps:
    - name: "Step 01: Create-falco"
      description: Real Falco in enforce mode.
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-rulesfile"
      description: Rulesfile from the local OCI registry; declares a container plugin dependency.
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-official
                    tag: latest
                  registry:
                    name: ($oci_registry)
                    plainHTTP: true

    - name: "Step 03: Create-plugin-bad-tag"
      description: |
        Create the container Plugin with a nonexistent OCI tag so it cannot be
        fetched or programmed. We use apply-plugin (not apply-assert-plugin) because
        we explicitly do not want to wait for Programmed=True.
      use:
        template: ../../common/_step_templates/apply-plugin.yaml
        with:
          bindings:
            - name: plugin_name
              value: ($plugin_name)
            - name: namespace
              value: ($namespace)
            - name: plugin_oci_repo
              value: falco-test/plugin-container
            - name: plugin_oci_tag
              value: this-tag-does-not-exist
            - name: plugin_oci_registry
              value: ($oci_registry)

    - name: "Step 04: Assert-not-programmed"
      description: |
        The container dependency is unmet (plugin not loaded in Falco) so enforce
        mode keeps the Rulesfile blocked: DependenciesSatisfied=False, Programmed=False.
        The Plugin is not programmed either: the instance operator could not fetch its
        OCI metadata (bad tag) and set Programmed=False with reason OCIArtifactProgramFailed.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'False'
                    reason: DependenciesNotSatisfied
                (conditions[?type == 'Programmed']):
                  - status: 'False'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              metadata:
                name: ($plugin_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    reason: OCIArtifactProgramFailed

    - name: "Step 05: Assert-plugin-assigned-but-not-installed"
      description: |
        fetchAndCacheArtifactMeta failed (bad OCI tag), so the Plugin's ObservedGeneration
        is not stamped and the per-node artifact operators stay deferred. The Plugin is
        nevertheless assigned, because assignment only follows the selector, and no node
        reports anything installed for it.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
              spec:
                (artifacts[?kind == 'Plugin' && name == $plugin_name]):
                  - kind: Plugin
        - error:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
              status:
                (artifacts[?kind == 'Plugin' && name == $plugin_name && length(installedArtifacts || `[]`) > `0`]):
                  - kind: Plugin
        - error:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
              status:
                (artifacts[?kind == 'Plugin' && name == $plugin_name && length((conditions || `[]`)[?type == 'Programmed' && status == 'True']) > `0`]):
                  - kind: Plugin

    - name: "Step 05b: Assert-no-binary-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /usr/share/falco/plugins
            - name: expected_file
              value: (join('', [$plugin_name, '.so']))
            - name: should_exist
              value: "false"

    - name: "Step 06: Delete-plugin-succeeds"
      description: |
        Delete the plugin. Nothing is installed for it, so the artifact operators only
        drop their entries once the assignment controller removes it from the nodes, and
        the node-objects-in-use finalizer is released within seconds.
      try:
        - delete:
            ref:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              name: ($plugin_name)
              namespace: ($namespace)
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: Plugin
            name: ($plugin_name)
            namespace: ($namespace)
            timeout: 60s
            for:
              deletion: {}

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
