apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-update-cm-ref-missing
spec:
  description: |
    Validates that swapping configMapRef.name to a ConfigMap that does not exist
    sets ResolvedRefs=False and Programmed=False, while leaving the previously
    installed rules file untouched on disk.

    Setup: Falco (real, enforce mode). CM-A pre-created and initially referenced.
    Rulesfile reaches Programmed=True with CM-A's content on disk.

    After patching configMapRef.name to a nonexistent ConfigMap:
    - The per-node operator's reference resolution fails: ResolvedRefs=False,
      reason=ReferenceResolutionFailed.
    - Programmed=False (reference resolution failure blocks installation).
    - The rules file already on disk is NOT removed: a broken update must never
      delete a working install.

  bindings:
    - name: falco_name
      value: falco-update-cm-ref-missing-test
    - name: rulesfile_name
      value: rulesfile-update-cm-ref-missing-test
    - name: cm_a_name
      value: rulesfile-update-cm-ref-missing-cm-a
    - name: test_name
      value: rulesfile-update-cm-ref-missing

  steps:
    - name: "Step 01: Create-falco"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-configmap-A"
      use:
        template: ../../common/_step_templates/apply-configmap-from-file.yaml
        with:
          bindings:
            - name: configmap_name
              value: ($cm_a_name)
            - name: namespace
              value: ($namespace)
            - name: source_file
              value: rules-a.yaml

    - name: "Step 03: Create-rulesfile-pointing-to-A"
      use:
        template: ../../common/_step_templates/apply-assert-rulesfile-configmap.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_configmap_name
              value: ($cm_a_name)

    - name: "Step 04: Assert-file-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-02-rulesfile-update-cm-ref-missing-test-configmap.yaml
            - name: should_exist
              value: "true"

    - name: "Step 05: Assert-cm-a-content-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-content-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: content_pattern
              value: "marker=cm-ref-missing-a"

    - name: "Step 06: Swap-configMapRef-to-nonexistent"
      try:
        - patch:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              spec:
                configMapRef:
                  name: rulesfile-update-cm-ref-missing-cm-does-not-exist

    - name: "Step 07: Assert-reference-resolution-failed"
      description: |
        The missing ConfigMap causes reference resolution to fail on the per-node operator.
        ResolvedRefs=False and Programmed=False on both the Rulesfile and ArtifactNode.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'False'
                    reason: ReferenceResolutionFailed
                (conditions[?type == 'Programmed']):
                  - status: 'False'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'False'
                    reason: ReferenceResolutionFailed
                (conditions[?type == 'Programmed']):
                  - status: 'False'

    - name: "Step 08: Assert-old-file-still-on-filesystem"
      description: The broken update must not remove the working install.
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-02-rulesfile-update-cm-ref-missing-test-configmap.yaml
            - name: should_exist
              value: "true"

    - name: "Step 09: Assert-old-content-still-on-filesystem"
      description: File content must be from CM-A, not overwritten or cleared.
      use:
        template: ../../common/_step_templates/assert-content-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: content_pattern
              value: "marker=cm-ref-missing-a"

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
