apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: config-basic-configmap
spec:
  description: |
    Validates the full ConfigMap-sourced Config lifecycle against a real Falco instance:
    1. Create a Falco DaemonSet.
    2. Create a ConfigMap with key "config.yaml" (valid Falco config content).
    3. Create a Config CR with spec.configMapRef pointing to the ConfigMap.
    4. Assert ResolvedRefs=True, ConfigMapArtifactProgrammed=True, Programmed=True
       on both the Config CR and the ArtifactNode.
    5. Assert the config file is present at the expected path in /etc/falco/config.d.
    6. Assert the file content contains the marker from the ConfigMap.
    7. Delete the Config CR.
    8. Assert the ArtifactNode is garbage-collected.
    9. Assert the config file is absent from the node filesystem.

  bindings:
    - name: falco_name
      value: falco-config-basic-configmap-test
    - name: config_name
      value: config-basic-configmap-test
    - name: cm_name
      value: config-basic-configmap-cm
    - name: test_name
      value: config-basic-configmap

  steps:
    - name: "Step 01: Create-falco"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-configmap"
      use:
        template: ../../common/_step_templates/apply-configmap-from-file.yaml
        with:
          bindings:
            - name: configmap_name
              value: ($cm_name)
            - name: namespace
              value: ($namespace)
            - name: source_file
              value: config-a.yaml
            - name: data_key
              value: config.yaml

    - name: "Step 03: Create-config-configmap"
      use:
        template: ../../common/_step_templates/apply-config.yaml
        with:
          bindings:
            - name: config_name
              value: ($config_name)
            - name: namespace
              value: ($namespace)
            - name: config_spec
              value:
                configMapRef:
                  name: config-basic-configmap-cm

    - name: "Step 04: Assert-conditions"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              metadata:
                name: ($config_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($config_name)
                  artifact.falcosecurity.dev/kind: config
              status:
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'True'
                (conditions[?type == 'ConfigMapArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (installedArtifacts[?medium == 'configmap']):
                  - path: /etc/falco/config.d/50-02-config-basic-configmap-test-configmap.yaml
                    priority: 50

    - name: "Step 05: Assert-file-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/config.d
            - name: expected_file
              value: 50-02-config-basic-configmap-test-configmap.yaml
            - name: should_exist
              value: "true"

    - name: "Step 06: Assert-content-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-content-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/config.d
            - name: content_pattern
              value: "marker: config-basic-cm"

    - name: "Step 07: Delete-config"
      try:
        - delete:
            ref:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              name: ($config_name)
              namespace: ($namespace)
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: ArtifactNode
            namespace: ($namespace)
            selector: (join('', ['artifact.falcosecurity.dev/parent=', $config_name]))
            for:
              deletion: {}

    - name: "Step 08: Assert-file-absent-from-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/config.d
            - name: expected_file
              value: 50-02-config-basic-configmap-test-configmap.yaml
            - name: should_exist
              value: "false"

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
