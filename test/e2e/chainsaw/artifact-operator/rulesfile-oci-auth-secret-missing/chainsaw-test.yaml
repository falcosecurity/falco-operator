apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-oci-auth-secret-missing
spec:
  description: |
    Validates that referencing a nonexistent OCI auth secret in a Rulesfile results in
    Programmed=False/ProgramFailed.

    The instance operator's FetchConfig calls fetchOCIAuthSecret proactively before making
    any OCI request. When the referenced Secret does not exist, the GET fails immediately
    and the instance operator sets Programmed=False/ProgramFailed on the parent
    Rulesfile CR. ObservedGeneration is NOT advanced, so the per-node sidecar is deferred
    and never runs. No rules file is written to disk.

    This test uses the local plain-HTTP registry (which requires no authentication) combined
    with a non-existent secretRef to exercise the auth-secret resolution failure path in the
    instance operator without needing a real registry auth challenge.

    Setup: Rulesfile with OCI source from local registry + auth.secretRef.name pointing to
    a Secret that does not exist.

    Expected outcome:
    - Programmed=False, reason=ProgramFailed on the Rulesfile.
    - No ArtifactNode created.
    - No rules file written to disk.

  bindings:
    - name: falco_name
      value: falco-oci-auth-secret-missing-rf-test
    - name: rulesfile_name
      value: rulesfile-oci-auth-secret-missing-test
    - name: test_name
      value: rulesfile-oci-auth-secret-missing
    - name: oci_registry
      value: registry.oci-registry.svc.cluster.local:5000

  steps:
    - name: "Step 01: Create-falco"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-rulesfile-with-missing-auth-secret"
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-engine-req-met
                    tag: latest
                  registry:
                    name: ($oci_registry)
                    plainHTTP: true
                    auth:
                      secretRef:
                        name: rulesfile-oci-auth-secret-does-not-exist

    - name: "Step 03: Assert-programmed-false"
      description: |
        fetchOCIAuthSecret fails (Secret not found) → FetchConfig returns error →
        fetchAndCacheArtifactMeta fails → Programmed=False/ProgramFailed.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    reason: ProgramFailed

    - name: "Step 04: Assert-no-artifact-node"
      description: ObservedGeneration not stamped → per-node sidecar deferred → no ArtifactNode update.
      try:
        - error:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)

    - name: "Step 05: Assert-no-file-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-01-rulesfile-oci-auth-secret-missing-test-oci.yaml
            - name: should_exist
              value: "false"

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
