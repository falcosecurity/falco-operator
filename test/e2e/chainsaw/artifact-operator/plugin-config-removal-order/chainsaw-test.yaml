apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: plugin-config-removal-order
spec:
  description: |
    Validates that deleting one plugin from a two-plugin setup correctly rewrites the shared
    plugins config file (removing only the deleted plugin) without removing the file entirely
    or corrupting the remaining plugin's entry.

    Both plugins remain at their accepted configuration on a Falco DaemonSet.
    No rejected update or sidecar restart precedes deletion: this exercises ordinary
    removal while another healthy plugin remains installed.

    The sidecar removes the config entry before its binary. The shared config file
    must be rewritten with the remaining plugin's entry intact.

    Flow:
    1. Install container plugin → Programmed=True.
    2. Install json plugin → Programmed=True.
    3. Assert both .so files on disk. Assert both plugins appear in the config file.
    4. Observe both plugins loaded by Falco before deleting json.
    5. Delete the json Plugin CR. Wait for its ArtifactNode to be GC'd.
    6. Assert json .so absent. Assert container .so still present.
    7. Assert plugin config file still exists with container entry but NOT json.
    8. Observe container still loaded by Falco and json absent from the same response.

  bindings:
    - name: falco_name
      value: falco-plugin-config-removal-test
    - name: container_plugin
      value: container
    - name: json_plugin
      value: json
    - name: test_name
      value: plugin-config-removal-order
    - name: oci_registry
      value: registry.oci-registry.svc.cluster.local:5000
    - name: plugin_config_file
      value: 99-03-plugins-config-inline.yaml

  steps:
    - name: "Step 01: Create-falco"
      description: |
        Create the Falco DaemonSet used by the ordinary plugin-removal scenario.
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: falco_type
              value: DaemonSet

    - name: "Step 02: Install-container-plugin"
      description: |
        Install container with its default configuration and wait for programming.
      use:
        template: ../../common/_step_templates/apply-assert-plugin.yaml
        with:
          bindings:
            - name: plugin_name
              value: ($container_plugin)
            - name: namespace
              value: ($namespace)
            - name: plugin_oci_repo
              value: falco-test/plugin-container
            - name: plugin_oci_tag
              value: latest
            - name: plugin_oci_registry
              value: ($oci_registry)
            - name: plugin_plain_http
              value: true

    - name: "Step 03: Install-json-plugin"
      description: |
        Install json alongside container so deletion must rewrite the shared configuration.
      use:
        template: ../../common/_step_templates/apply-assert-plugin.yaml
        with:
          bindings:
            - name: plugin_name
              value: ($json_plugin)
            - name: namespace
              value: ($namespace)
            - name: plugin_oci_repo
              value: falco-test/plugin-json
            - name: plugin_oci_tag
              value: latest
            - name: plugin_oci_registry
              value: ($oci_registry)
            - name: plugin_plain_http
              value: true

    - name: "Step 04: Assert-both-binaries-on-filesystem"
      description: |
        Verify both container and json binaries are installed before deleting either plugin.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: DIR
                value: /usr/share/falco/plugins
              - name: EXPECTED_FILE
                value: (join('', [$container_plugin, '.so']))
              - name: SHOULD_EXIST
                value: "true"
            content: |
              bash ../../common/scripts/assert_file_on_node.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: DIR
                value: /usr/share/falco/plugins
              - name: EXPECTED_FILE
                value: (join('', [$json_plugin, '.so']))
              - name: SHOULD_EXIST
                value: "true"
            content: |
              bash ../../common/scripts/assert_file_on_node.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true

    - name: "Step 05: Assert-container-in-plugin-config"
      description: |
        Verify container appears exactly once in both shared configuration lists.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: FILE_PATH
                value: /etc/falco/config.d/99-03-plugins-config-inline.yaml
              - name: PLUGIN_NAME
                value: ($container_plugin)
            content: |
              bash ../../common/scripts/check_plugin_config_on_node.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true

    - name: "Step 06: Assert-json-in-plugin-config"
      description: |
        Verify json appears exactly once in both shared configuration lists.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: FILE_PATH
                value: /etc/falco/config.d/99-03-plugins-config-inline.yaml
              - name: PLUGIN_NAME
                value: ($json_plugin)
            content: |
              bash ../../common/scripts/check_plugin_config_on_node.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true

    - name: "Step 07: Assert-both-plugins-loaded-in-falco"
      description: |
        Observe both plugins loaded before requesting json deletion.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: PLUGIN_NAME
                value: ($container_plugin)
            content: |
              bash ../../common/scripts/check_falco_plugin_loaded.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: PLUGIN_NAME
                value: ($json_plugin)
            content: |
              bash ../../common/scripts/check_falco_plugin_loaded.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true

    - name: "Step 08: Delete-json-plugin"
      description: Delete the json Plugin CR. No Rulesfile references it, so no finalizer blocks deletion.
      try:
        - delete:
            ref:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              name: ($json_plugin)
              namespace: ($namespace)
        - wait:
            apiVersion: artifact.falcosecurity.dev/v1alpha1
            kind: ArtifactNode
            namespace: ($namespace)
            selector: (join('', ['artifact.falcosecurity.dev/parent=', $json_plugin]))
            for:
              deletion: {}

    - name: "Step 09: Assert-json-binary-absent"
      description: |
        The deleted json plugin's binary must be absent from the node filesystem.
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /usr/share/falco/plugins
            - name: expected_file
              value: (join('', [$json_plugin, '.so']))
            - name: should_exist
              value: "false"

    - name: "Step 10: Assert-container-binary-still-present"
      description: |
        The healthy container plugin's binary must remain installed after removing json.
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /usr/share/falco/plugins
            - name: expected_file
              value: (join('', [$container_plugin, '.so']))
            - name: should_exist
              value: "true"

    - name: "Step 11: Assert-plugin-config-file-still-exists"
      description: File must NOT be deleted; container still has an entry.
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/config.d
            - name: expected_file
              value: ($plugin_config_file)
            - name: should_exist
              value: "true"

    - name: "Step 12: Assert-container-still-in-plugin-config"
      description: Container plugin entry must remain intact in the rewritten config file.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: FILE_PATH
                value: /etc/falco/config.d/99-03-plugins-config-inline.yaml
              - name: PLUGIN_NAME
                value: ($container_plugin)
            content: |
              bash ../../common/scripts/check_plugin_config_on_node.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true
              (length(json_parse($stdout).config.plugins)): 1
              (length(json_parse($stdout).config.load_plugins)): 1

    - name: "Step 13: Assert-json-absent-from-plugin-config"
      description: |
        After json Plugin deletion, its load_plugins entry and plugins[] entry must be gone.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: FILE_PATH
                value: /etc/falco/config.d/99-03-plugins-config-inline.yaml
              - name: PLUGIN_NAME
                value: ($json_plugin)
            content: |
              bash ../../common/scripts/check_plugin_config_entry_absent.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true

    - name: "Step 14: Assert-only-container-loaded-in-falco"
      description: |
        Observe container still loaded and json absent from Falco's /versions response.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: PLUGIN_NAME
                value: ($container_plugin)
              - name: ABSENT_PLUGINS
                value: '["json"]'
            content: |
              bash ../../common/scripts/check_falco_plugin_loaded.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
