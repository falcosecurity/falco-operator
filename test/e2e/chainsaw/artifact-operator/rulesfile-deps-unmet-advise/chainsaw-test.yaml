apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-deps-unmet-advise
spec:
  description: |
    Validates that a Rulesfile whose declared requirement is not satisfied by the
    running Falco version is installed anyway in advise mode.

    Setup: real Falco in advise mode (--enforce-requirements=false). The Rulesfile
    inline source declares required_engine_version=999.0.0, always higher than any
    real Falco engine_version_semver, guaranteeing the requirement is never met.

    Expected outcome:
    - DependenciesSatisfied=False, reason=DependenciesNotSatisfiedInstalledAnyway.
    - InlineArtifactProgrammed=True (installation proceeds despite unmet req).
    - Programmed=True (advise mode skips DependenciesSatisfied when computing Programmed).
    - The inline file is written to the node filesystem.
    - installedArtifacts has one entry for the inline medium.

  bindings:
    - name: falco_name
      value: falco-deps-unmet-advise-test
    - name: rulesfile_name
      value: rulesfile-deps-unmet-advise-test
    - name: test_name
      value: rulesfile-deps-unmet-advise

  steps:
    - name: "Step 01: Create-falco-advise-mode"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: enforce_requirements
              value: "--enforce-requirements=false"

    - name: "Step 02: Create-rulesfile-with-unmet-engine-req"
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                inlineRules:
                  - required_engine_version: "999.0.0"
                  - rule: Chainsaw deps-unmet-advise inline rule
                    desc: Rule requiring engine 999.0.0, always unmet with any real Falco (advise mode).
                    condition: "evt.type = execve"
                    output: "process=%proc.cmdline marker=unmet-advise"
                    priority: DEBUG
                    tags: [test, chainsaw, deps]

    - name: "Step 03: Assert-installed-despite-unmet-req"
      description: |
        Advise mode proceeds: DependenciesSatisfied=False (advisory only),
        InlineArtifactProgrammed=True, Programmed=True.
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'False'
                    reason: DependenciesNotSatisfiedInstalledAnyway
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 1
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'False'
                    reason: DependenciesNotSatisfiedInstalledAnyway
                (conditions[?type == 'InlineArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (installedArtifacts[?medium == 'inline']):
                  - path: /etc/falco/rules.d/50-03-rulesfile-deps-unmet-advise-test-inline.yaml
                    priority: 50

    - name: "Step 04: Assert-file-on-filesystem"
      description: File is written even though the requirement is not met (advise mode).
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-03-rulesfile-deps-unmet-advise-test-inline.yaml
            - name: should_exist
              value: "true"

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
