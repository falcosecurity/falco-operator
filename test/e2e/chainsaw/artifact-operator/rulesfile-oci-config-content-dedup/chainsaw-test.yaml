apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rulesfile-oci-config-content-dedup
spec:
  description: |
    Validates that when the OCI config layer AND the YAML content both declare the same
    requirement (engine_version_semver=0.0.1), DeduplicateArtifactMeta merges them into
    a single requirement without double-counting, and the artifact is installed against a
    real Falco instance.

    The OCI artifact (falco-test/rulesfile-config-content-reqs) was pushed with:
      falcoctl registry push --requires engine_version_semver:0.0.1
    And its YAML content also contains: required_engine_version: "0.0.1"

    Both occurrences map to the same engine_version_semver capability. Any real Falco
    satisfies the 0.0.1 floor, so the deduplicated requirement is met.

    Expected outcome:
    - DependenciesSatisfied=True (single deduplicated requirement met).
    - OCIArtifactProgrammed=True, Programmed=True.
    - OCI file written to the node filesystem.
    - installedArtifacts has one entry for oci medium.

  bindings:
    - name: falco_name
      value: falco-oci-config-content-dedup-test
    - name: rulesfile_name
      value: rulesfile-oci-config-content-dedup-test
    - name: test_name
      value: rulesfile-oci-config-content-dedup

  steps:
    - name: "Step 01: Create-falco"
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)

    - name: "Step 02: Create-rulesfile-oci-local"
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: ($rulesfile_name)
            - name: namespace
              value: ($namespace)
            - name: rulesfile_spec
              value:
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-config-content-reqs
                    tag: latest
                  registry:
                    name: registry.oci-registry.svc.cluster.local:5000
                    plainHTTP: true

    - name: "Step 03: Assert-conditions"
      try:
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: ($rulesfile_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                namespace: ($namespace)
                labels:
                  artifact.falcosecurity.dev/parent: ($rulesfile_name)
                  artifact.falcosecurity.dev/kind: rulesfile
              status:
                (length(installedArtifacts || `[]`)): 1
                (conditions[?type == 'DependenciesSatisfied']):
                  - status: 'True'
                (conditions[?type == 'OCIArtifactProgrammed']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (installedArtifacts[?medium == 'oci']):
                  - path: /etc/falco/rules.d/50-01-rulesfile-oci-config-content-dedup-test-oci.yaml
                    priority: 50

    - name: "Step 04: Assert-file-on-filesystem"
      use:
        template: ../../common/_step_templates/assert-file-on-node.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: dir
              value: /etc/falco/rules.d
            - name: expected_file
              value: 50-01-rulesfile-oci-config-content-dedup-test-oci.yaml
            - name: should_exist
              value: "true"

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
