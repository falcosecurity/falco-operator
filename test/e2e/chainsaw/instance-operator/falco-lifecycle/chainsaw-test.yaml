apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: falco-lifecycle
spec:
  description: |
    Falco controller resource-management lifecycle, distinct from the artifact-operator
    suite (which only ever exercises Plugin/Rulesfile/Config against an already-existing
    Falco and never touches the Falco CR's own reconciliation):
    1. Create as DaemonSet; assert the DaemonSet, and the Falco CR's resourceType/version/
       conditions, are all correct.
    2. Re-apply the identical spec; assert the reconcile is a no-op (no pod restart), proving
       ensureDeployment/ensureDaemonSet compares before writing rather than always updating.
    3. Reject a legacy artifact-operator override in initContainers without changing the
       existing DaemonSet or restarting its running Pod. Requesting a Deployment with
       that invalid override must also preserve the DaemonSet.
    4. Restore the DaemonSet type and move the override to containers; assert fresh successful
       reconciliation and the env override on the updated DaemonSet and ready Pods.
    5. Patch spec.type to Deployment; assert the DaemonSet is torn down, a Deployment takes
       its place and becomes ready, and the Falco CR reflects the new resourceType.
    6. Delete the Falco CR; assert every owned namespaced (Deployment, ServiceAccount, Role,
       RoleBinding) and cluster-scoped (ClusterRole, ClusterRoleBinding) resource is gone.

  bindings:
    - name: falco_name
      value: falco-lifecycle-test
    - name: test_name
      value: falco-lifecycle

  steps:
    - name: Create-falco-as-daemonset
      description: Create a Falco instance with the DaemonSet workload type.
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_type
              value: DaemonSet

    - name: Wait-for-falco-pod-ready
      description: Wait for the Falco Pod to become ready before testing its lifecycle.
      use:
        template: ../../common/_step_templates/wait-falco-pod-ready.yaml

    - name: Assert-daemonset-ready
      description: |
        The DaemonSet itself, not just the Falco CR's conditions, is up. Compares
        numberReady/desiredNumberScheduled against each other rather than a hardcoded count.
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              status:
                (desiredNumberScheduled >= `1`): true
                (numberReady == desiredNumberScheduled): true

    - name: Assert-falco-status-as-daemonset
      description: Verify the Falco CR reports the DaemonSet workload type and expected version.
      use:
        template: ../../common/_step_templates/assert-falco-status.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: expected_resource_type
              value: DaemonSet
            - name: expected_version
              value: "0.44.1"

    - name: Reapply-identical-falco-spec
      description: Re-applying the same spec must be a no-op reconcile, not a pod restart.
      use:
        template: ../../common/_step_templates/apply-assert-falco.yaml
        with:
          bindings:
            - name: falco_type
              value: DaemonSet

    - name: Assert-no-pod-restart-after-reapply
      description: Verify container restart counts remain zero after reapplying the identical spec.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
            content: |
              bash ../../common/scripts/check_no_pod_restarts.sh
            check:
              (to_string(json_parse($stdout).status) == 'success'): true

    - name: Cache-artifact-for-certificate-recovery
      description: Cache the existing rules fixture to verify authenticated downloads during Certificate recovery.
      use:
        template: ../../common/_step_templates/apply-rulesfile.yaml
        with:
          bindings:
            - name: rulesfile_name
              value: certificate-recovery-rules
            - name: rulesfile_spec
              value:
                ociArtifact:
                  image:
                    repository: falco-test/rulesfile-engine-req-met
                    tag: latest
                  registry:
                    name: registry.oci-registry.svc.cluster.local:5000
                    plainHTTP: true

    - name: Recover-client-certificate-without-falco-edit
      description: |
        With mTLS, delete the generated Certificate and require a new Ready Certificate
        owned by the unchanged Falco, then verify an authenticated artifact download.
        Without mTLS, verify HTTP downloads without accessing Certificate resources.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
              - name: RULESFILE_NAME
                value: certificate-recovery-rules
            content: bash check_certificate_recovery.sh
            check:
              (json_parse($stdout).status): success

    - name: Reject-legacy-artifact-operator-init-container-override
      description: |
        An artifact-operator override in initContainers must report the placement error
        for the current Falco generation. The existing DaemonSet keeps its regular
        sidecar without the rejected env; the captured ready Pod keeps its UID and
        zero restart counts. Capture and compare identities within this step.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: daemonsets.apps
              - name: NAME
                value: ($falco_name)
            content: bash ../../common/scripts/get_resource_uid.sh
            check:
              (json_parse($stdout).status == 'success'): true
            outputs:
              - name: original_daemonset_uid
                value: (json_parse($stdout).uid)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
            content: bash ../../common/scripts/check_no_pod_restarts.sh
            check:
              (json_parse($stdout).status == 'success'): true
            outputs:
              - name: original_pod_name
                value: (json_parse($stdout).pod)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: pods
              - name: NAME
                value: ($original_pod_name)
            content: bash ../../common/scripts/get_resource_uid.sh
            check:
              (json_parse($stdout).status == 'success'): true
            outputs:
              - name: original_pod_uid
                value: (json_parse($stdout).uid)
        - patch:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              spec:
                podTemplateSpec:
                  spec:
                    initContainers:
                      - name: artifact-operator
                        restartPolicy: Always
                        env:
                          - name: SIDECAR_OVERRIDE_TEST
                            value: configured
        - assert:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              (status.conditions[?type == 'Reconciled'].observedGeneration == [metadata.generation]): true
              status:
                resourceType: DaemonSet
                (conditions[?type == 'Reconciled']):
                  - status: 'False'
                    reason: ApplyConfigurationError
                    message: 'Unable to generate apply configuration: sidecar "artifact-operator" must be configured in spec.podTemplateSpec.spec.containers, not initContainers'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
                uid: ($original_daemonset_uid)
              spec:
                template:
                  spec:
                    (length(initContainers[?name == 'artifact-operator'] || `[]`)): 0
                    (containers[?name == 'artifact-operator']):
                      - (length(env[?name == 'SIDECAR_OVERRIDE_TEST'] || `[]`)): 0
              status:
                (desiredNumberScheduled >= `1`): true
                (numberReady == desiredNumberScheduled): true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: ($original_pod_name)
                namespace: ($namespace)
                uid: ($original_pod_uid)
              spec:
                (length(initContainers[?name == 'artifact-operator'] || `[]`)): 0
                (containers[?name == 'artifact-operator']):
                  - (length(env[?name == 'SIDECAR_OVERRIDE_TEST'] || `[]`)): 0
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (length(containerStatuses[?to_string(restartCount) != '0'])): 0
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: FALCO_NAME
                value: ($falco_name)
            content: bash ../../common/scripts/check_no_pod_restarts.sh
            check:
              (json_parse($stdout).status == 'success'): true
              (json_parse($stdout).pod == $original_pod_name): true

    - name: Reject-workload-switch-with-invalid-override
      description: |
        Requesting a Deployment while the override is still invalid must not delete the
        working DaemonSet. Capture its UID within this step and require the error for the
        new Falco generation before checking that it remains ready with no replacement.
        Its ConfigMap must retain the DaemonSet engine, including for replacement Pods.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE
                value: daemonsets.apps
              - name: NAME
                value: ($falco_name)
            content: bash ../../common/scripts/get_resource_uid.sh
            check:
              (json_parse($stdout).status == 'success'): true
            outputs:
              - name: original_daemonset_uid
                value: (json_parse($stdout).uid)
        - patch:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              spec:
                type: Deployment
                replicas: 1
        - assert:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              (status.conditions[?type == 'Reconciled'].observedGeneration == [metadata.generation]): true
              status:
                resourceType: Deployment
                (conditions[?type == 'Reconciled']):
                  - status: 'False'
                    reason: ApplyConfigurationError
                    message: 'Unable to generate apply configuration: sidecar "artifact-operator" must be configured in spec.podTemplateSpec.spec.containers, not initContainers'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
                uid: ($original_daemonset_uid)
                (deletionTimestamp == null): true
              status:
                (desiredNumberScheduled >= `1`): true
                (numberReady == desiredNumberScheduled): true
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              "(contains(data.\"falco.yaml\", 'kind: modern_ebpf'))": true
              "(contains(data.\"falco.yaml\", 'kind: nodriver'))": false
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ($falco_name)
                namespace: ($namespace)

    - name: Move-artifact-operator-override-to-regular-container
      description: |
        Restore the DaemonSet type and correct the override without automatic migration:
        remove the legacy initContainers entry and put its env on the regular sidecar.
        Preserve all three original container definitions, including images, sidecar args and netshoot.
        Require current-generation status, a completed DaemonSet rollout and ready Pods
        carrying the env before continuing the original DaemonSet-to-Deployment lifecycle.
      try:
        - patch:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              spec:
                type: DaemonSet
                podTemplateSpec:
                  spec:
                    initContainers: null
                    containers:
                      - name: falco
                        image: (env('CHAINSAW_FALCO_IMAGE'))
                        tty: true
                      - name: artifact-operator
                        image: (env('CHAINSAW_ARTIFACT_OPERATOR_IMAGE'))
                        imagePullPolicy: Never
                        args:
                          - --enforce-requirements=true
                        env:
                          - name: SIDECAR_OVERRIDE_TEST
                            value: configured
                      - name: netshoot
                        image: nicolaka/netshoot
                        command: ["sleep", "infinity"]
                        stdin: true
                        tty: true
        - assert:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              (status.conditions[?type == 'Reconciled'].observedGeneration == [metadata.generation]): true
              status:
                resourceType: DaemonSet
                (conditions[?type == 'Reconciled']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              (status.observedGeneration == metadata.generation): true
              spec:
                template:
                  spec:
                    (length(initContainers[?name == 'artifact-operator'] || `[]`)): 0
                    (containers[?name == 'artifact-operator']):
                      - (env[?name == 'SIDECAR_OVERRIDE_TEST']):
                          - value: configured
              status:
                (desiredNumberScheduled >= `1`): true
                (updatedNumberScheduled == desiredNumberScheduled): true
                (numberReady == desiredNumberScheduled): true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: ($namespace)
                labels:
                  app.kubernetes.io/name: ($falco_name)
              spec:
                (length(initContainers[?name == 'artifact-operator'] || `[]`)): 0
                (containers[?name == 'artifact-operator']):
                  - (env[?name == 'SIDECAR_OVERRIDE_TEST']):
                      - value: configured
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'

    - name: Switch-falco-type-to-deployment
      description: Request a Deployment with one replica for the existing Falco instance.
      try:
        - patch:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              spec:
                type: Deployment
                replicas: 1

    - name: Assert-daemonset-torn-down
      description: Verify the previous DaemonSet is removed after the workload-type change.
      try:
        - error:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: ($falco_name)
                namespace: ($namespace)

    - name: Assert-deployment-ready
      description: Wait for the replacement Deployment to have one ready and available replica.
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
              status:
                availableReplicas: 1
                readyReplicas: 1

    - name: Assert-falco-status-as-deployment
      description: Verify the Falco CR reports the Deployment workload type and expected version.
      use:
        template: ../../common/_step_templates/assert-falco-status.yaml
        with:
          bindings:
            - name: falco_name
              value: ($falco_name)
            - name: namespace
              value: ($namespace)
            - name: expected_resource_type
              value: Deployment
            - name: expected_version
              value: "0.44.1"

    - name: Delete-falco
      description: Delete the Falco CR to trigger cleanup of its managed resources.
      try:
        - delete:
            ref:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              name: ($falco_name)
              namespace: ($namespace)

    - name: Assert-namespaced-resources-gone
      description: Verify the Deployment, ServiceAccount, Role and RoleBinding are removed.
      try:
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
        - error:
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
        - error:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: ($falco_name)
                namespace: ($namespace)
        - error:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: ($falco_name)
                namespace: ($namespace)

    - name: Assert-cluster-scoped-resources-gone
      description: |
        ClusterRole/ClusterRoleBinding names are "<falco_name>--<namespace>"
        (resources.GenerateUniqueName), since they're cluster-scoped and must stay unique
        across every Falco instance in every namespace.
      try:
        - error:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: (join('--', [$falco_name, $namespace]))
        - error:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: (join('--', [$falco_name, $namespace]))

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../../common/scripts/debug_snapshot.sh
