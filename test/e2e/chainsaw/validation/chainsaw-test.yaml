apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validation
spec:
  description: |
    CRD-level admission validation (CEL rules and kubebuilder markers on the API types
    themselves), distinct from every other test in this suite, which only ever exercises
    valid specs and controller-level (not admission-level) behavior. Cross-cutting across
    both artifact.falcosecurity.dev (Config, Rulesfile, Plugin) and
    instance.falcosecurity.dev (Falco, Component), so it doesn't belong under either the
    artifact-operator or instance-operator category on its own.
    Each case creates a deliberately invalid resource and asserts the API server itself
    rejects it (chainsaw's $error), never reaching a controller.

  bindings:
    - name: test_name
      value: validation

  steps:
    - name: Reject-invalid-falco-type
      try:
        - create:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: invalid-type
                namespace: ($namespace)
              spec:
                type: StatefulSet
            expect:
              - check:
                  ($error != null): true

    - name: Reject-falco-replicas-zero
      try:
        - create:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Falco
              metadata:
                name: invalid-replicas
                namespace: ($namespace)
              spec:
                type: Deployment
                replicas: 0
            expect:
              - check:
                  ($error != null): true

    - name: Reject-config-priority-over-99
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              metadata:
                name: invalid-priority-high
                namespace: ($namespace)
              spec:
                priority: 100
                config: "test: true"
            expect:
              - check:
                  ($error != null): true

    - name: Reject-config-priority-below-0
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Config
              metadata:
                name: invalid-priority-low
                namespace: ($namespace)
              spec:
                priority: -1
                config: "test: true"
            expect:
              - check:
                  ($error != null): true

    - name: Reject-rulesfile-ociartifact-without-image-repository
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: invalid-oci-no-repo
                namespace: ($namespace)
              spec:
                priority: 50
                ociArtifact:
                  image: {}
            expect:
              - check:
                  ($error != null): true

    - name: Reject-plugin-ociartifact-without-image
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              metadata:
                name: invalid-oci-no-image
                namespace: ($namespace)
              spec:
                ociArtifact: {}
            expect:
              - check:
                  ($error != null): true

    - name: Reject-rulesfile-plainhttp-and-tls-both-set
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Rulesfile
              metadata:
                name: invalid-oci-plainhttp-tls
                namespace: ($namespace)
              spec:
                priority: 50
                ociArtifact:
                  image:
                    repository: falcosecurity/rules/falco-rules
                  registry:
                    plainHTTP: true
                    tls:
                      insecureSkipVerify: true
            expect:
              - check:
                  ($error != null): true

    - name: Reject-plugin-plainhttp-and-tls-both-set
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: Plugin
              metadata:
                name: invalid-plugin-plainhttp-tls
                namespace: ($namespace)
              spec:
                ociArtifact:
                  image:
                    repository: falcosecurity/plugins/plugin/json
                  registry:
                    plainHTTP: true
                    tls:
                      insecureSkipVerify: true
            expect:
              - check:
                  ($error != null): true

    - name: Reject-invalid-component-type
      try:
        - create:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Component
              metadata:
                name: invalid-type
                namespace: ($namespace)
              spec:
                component:
                  type: invalid
            expect:
              - check:
                  ($error != null): true

    - name: Reject-component-replicas-zero
      try:
        - create:
            resource:
              apiVersion: instance.falcosecurity.dev/v1alpha1
              kind: Component
              metadata:
                name: invalid-replicas
                namespace: ($namespace)
              spec:
                component:
                  type: metacollector
                replicas: 0
            expect:
              - check:
                  ($error != null): true


    - name: Accept-a-valid-artifactnode
      description: The baseline of the rejections below, checked on the server without keeping the object (a controller would delete it at once, since no such node exists).
      try:
        - create:
            dryRun: true
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: valid
                namespace: ($namespace)
              spec:
                nodeName: some-node
                artifacts:
                  - kind: Rulesfile
                    name: rules
                    uid: 6d1f3a52-0000-4000-8000-000000000001
                  - kind: Rulesfile
                    name: other-rules
                    uid: 6d1f3a52-0000-4000-8000-000000000002
                  - kind: Plugin
                    name: rules
                    uid: 6d1f3a52-0000-4000-8000-000000000003

    - name: Reject-artifactnode-without-nodename
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: invalid-without-nodename
                namespace: ($namespace)
              spec:
                artifacts: []
            expect:
              - check:
                  ($error != null): true

    - name: Reject-artifactnode-with-empty-nodename
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: invalid-with-empty-nodename
                namespace: ($namespace)
              spec:
                nodeName: ""
            expect:
              - check:
                  ($error != null): true

    - name: Reject-artifactnode-artifact-of-another-kind
      description: Only Rulesfiles, Plugins and Configs can be assigned.
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: invalid-artifact-of-another-kind
                namespace: ($namespace)
              spec:
                nodeName: some-node
                artifacts:
                  - kind: Secret
                    name: not-an-artifact
                    uid: 6d1f3a52-0000-4000-8000-000000000001
            expect:
              - check:
                  ($error != null): true

    - name: Reject-artifactnode-artifact-without-uid
      description: The uid is what tells a recreated artifact from its predecessor, so an assignment without one is meaningless.
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: invalid-artifact-without-uid
                namespace: ($namespace)
              spec:
                nodeName: some-node
                artifacts:
                  - kind: Rulesfile
                    name: rules
            expect:
              - check:
                  ($error != null): true

    - name: Reject-artifactnode-artifact-with-empty-uid
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: invalid-artifact-with-empty-uid
                namespace: ($namespace)
              spec:
                nodeName: some-node
                artifacts:
                  - kind: Rulesfile
                    name: rules
                    uid: ""
            expect:
              - check:
                  ($error != null): true

    - name: Reject-artifactnode-artifact-without-name
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: invalid-artifact-without-name
                namespace: ($namespace)
              spec:
                nodeName: some-node
                artifacts:
                  - kind: Rulesfile
                    name: ""
                    uid: 6d1f3a52-0000-4000-8000-000000000001
            expect:
              - check:
                  ($error != null): true

    - name: Reject-artifactnode-duplicate-artifact
      description: A node lists an artifact once. Entries are unique by kind and name, whatever their uids.
      try:
        - create:
            resource:
              apiVersion: artifact.falcosecurity.dev/v1alpha1
              kind: ArtifactNode
              metadata:
                name: invalid-duplicate-artifact
                namespace: ($namespace)
              spec:
                nodeName: some-node
                artifacts:
                  - kind: Rulesfile
                    name: rules
                    uid: 6d1f3a52-0000-4000-8000-000000000001
                  - kind: Rulesfile
                    name: rules
                    uid: 6d1f3a52-0000-4000-8000-000000000002
            expect:
              - check:
                  ($error != null): true

    - name: Reject-artifactnode-with-more-than-100-artifacts
      description: The cap bounds the object's size, since every update rewrites and re-sends the whole object. 100 pass, 101 do not.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ARTIFACT_COUNT
                value: "100"
            content: bash ../common/scripts/create_artifactnode_dry_run.sh
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ARTIFACT_COUNT
                value: "101"
            content: bash ../common/scripts/create_artifactnode_dry_run.sh
            check:
              ($error != null): true

  catch:
    - description: Capture debug snapshot on failure
      script:
        env:
          - name: TEST_NAME
            value: ($test_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: falco-operator
        content: |
          bash ../common/scripts/debug_snapshot.sh
